name: SmartSkate
options:
  bundleIdPrefix: com.jseung
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SmartSkate:
    type: application
    platform: iOS
    sources: [SmartSkate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jseung.smartskate
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SmartSkate/Info.plist
      properties:
        CFBundleDisplayName: SmartSkate
        NSCameraUsageDescription: SmartSkate uses the camera to record your practice.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
